name: Autograding Tests
'on':
  - push
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Integrity check - tests, pom.xml and grading.json must be unchanged
        run: |
          EXPECTED="bf868b71be5a087def06abc359c0d6c2c18534e862d4994c37867ab836b4c18d"
          ACTUAL=$( (for f in $(find src/test/java -type f -name '*.java' | LC_ALL=C sort) pom.xml grading.json; do sed 's/\r$//' "$f"; done) | sha256sum | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The test files, pom.xml, or grading.json in this repository differ from the assignment template. Grading has been stopped. Restore the original files (git checkout origin/main -- src/test pom.xml grading.json) and push again."
            exit 1
          fi
          echo "Integrity check passed."
      - name: "Theater constructor (30)"
        id: theater
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Theater constructor"
          setup-command: ''
          command: mvn -B -q test -Dtest=TheaterTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 30
      - name: "reassignSeat (35)"
        id: reassignseat
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "reassignSeat"
          setup-command: ''
          command: mvn -B -q test -Dtest=ReassignSeatTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 35
      - name: "toString (35)"
        id: tostring
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "toString"
          setup-command: ''
          command: mvn -B -q test -Dtest=ToStringTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 35
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          THEATER_RESULTS: "${{ steps.theater.outputs.result }}"
          REASSIGNSEAT_RESULTS: "${{ steps.reassignseat.outputs.result }}"
          TOSTRING_RESULTS: "${{ steps.tostring.outputs.result }}"
        with:
          runners: theater,reassignseat,tostring
