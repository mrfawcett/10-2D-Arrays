name: Autograding Tests
'on':
  - push
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: "Theater constructor (30)"
        id: theater
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Theater constructor"
          setup-command: ''
          command: sh .github/grade.sh TheaterTest
          timeout: 5
          max-score: 30
      - name: "reassignSeat (35)"
        id: reassignseat
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "reassignSeat"
          setup-command: ''
          command: sh .github/grade.sh ReassignSeatTest
          timeout: 5
          max-score: 35
      - name: "toString (35)"
        id: tostring
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "toString"
          setup-command: ''
          command: sh .github/grade.sh ToStringTest
          timeout: 5
          max-score: 35
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          THEATER_RESULTS: "${{ steps.theater.outputs.result }}"
          REASSIGNSEAT_RESULTS: "${{ steps.reassignseat.outputs.result }}"
          TOSTRING_RESULTS: "${{ steps.tostring.outputs.result }}"
        with:
          runners: theater,reassignseat,tostring
